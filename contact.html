<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Contact Pavan Tech Solutions.">

    <title>Contact - Pavan Tech Solutions</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <nav class="navbar">

            <h1 class="logo">Pavan Tech Solutions</h1>

            <button id="menuButton" class="menu-button" aria-label="Open navigation menu">
                ☰
            </button>

            <ul id="navMenu" class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

        </nav>
    </header>

    <main>

        <section class="page-header">
            <h2>Contact Us</h2>
            <p>Have a project in mind? Send us a message.</p>
        </section>

        <section class="section">

            <form id="contactForm" class="contact-form">

                <label for="name">Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

                <span id="nameError" class="error"></span>


                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <span id="emailError" class="error"></span>


                <label for="message">Message</label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    placeholder="Enter your message"
                    required
                ></textarea>

                <span id="messageError" class="error"></span>

                <p id="messageCounter">Characters: 0</p>

                <button type="submit" class="btn">
                    Send Message
                </button>

                <p id="successMessage" class="success"></p>

            </form>

        </section>

    </main>

    <footer>
        <p>© 2026 Pavan Tech Solutions. All Rights Reserved.</p>
    </footer>

    <script src="js/script.js"></script>

</body>

</html>
